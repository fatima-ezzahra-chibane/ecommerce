name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        working-directory: backend
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

  api:
    name: API (Newman smoke)
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/backend/database/newman.sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Prepare Laravel
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate --force
          touch "$DB_DATABASE"
          php artisan migrate --seed --force

      - name: Start API
        working-directory: backend
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/categories >/dev/null && exit 0; sleep 1; done
          cat /tmp/serve.log; exit 1

      - name: Run Newman
        run: |
          npx --yes newman run postman/Vivid-Ecommerce.postman_collection.json \
            -e postman/Vivid-Local.postman_environment.json \
            --env-var "base_url=http://127.0.0.1:8000/api/v1" \
            --folder "0. Smoke Test (Runner)"

  frontend:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: |
          npm ci --include=dev
          npm install --no-save @rollup/rollup-linux-x64-gnu
        env:
          NODE_ENV: development

      - name: Run unit tests
        working-directory: frontend
        run: npx vitest run --reporter=verbose
        env:
          CI: true
          VITEST: 'true'
          NODE_ENV: test

  cv-service:
    name: CV service (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cv-service/requirements.txt

      - name: Install Python dependencies
        working-directory: cv-service
        run: pip install -r requirements.txt

      - name: Run unit tests
        working-directory: cv-service
        run: python -m unittest discover -s tests -t . -v
        env:
          CV_ONNX_PATH: ${{ runner.temp }}/mobilenetv2-12.onnx
